[package]
name = "xray-exporter"
version = "26.3.27"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "signal", "time"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
